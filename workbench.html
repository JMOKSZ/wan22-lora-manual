<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRA 工作台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FBFAF5; --surface:#FFFFFF; --ink:#26231C; --ink-soft:#6B6558;
  --line:#E3DFD2; --accent:#B53A2A; --accent-soft:#F6E8E4;
  --good:#2E6B4F; --good-soft:#E7F0EA; --warn-ink:#8A5A18; --warn-soft:#F8F0DC;
  --code-bg:#F2F0E8; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1915; --surface:#242119; --ink:#EDE7DA; --ink-soft:#A79E8C;
    --line:#3B362B; --accent:#D9705C; --accent-soft:#3A2620;
    --good:#7FB894; --good-soft:#222F27; --warn-ink:#D9B36A; --warn-soft:#332C1B;
    --code-bg:#2C2921;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1915; --surface:#242119; --ink:#EDE7DA; --ink-soft:#A79E8C;
  --line:#3B362B; --accent:#D9705C; --accent-soft:#3A2620;
  --good:#7FB894; --good-soft:#222F27; --warn-ink:#D9B36A; --warn-soft:#332C1B;
  --code-bg:#2C2921;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.7;
}
code,.mono{font-family:"IBM Plex Mono",monospace;font-size:.88em;background:var(--code-bg);padding:1.5px 6px;border-radius:5px}
button{font-family:inherit;cursor:pointer}
input,textarea,select{
  font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;outline:none;width:100%;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label.field{display:block;margin:14px 0 4px;font-size:13px;color:var(--ink-soft);font-weight:600}

.layout{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{
  width:230px;flex:none;border-right:1px solid var(--line);
  padding:26px 0;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--bg);
}
.rail-title{
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px;
  padding:0 22px 18px;border-bottom:1px solid var(--line);margin-bottom:10px;
}
.rail-title small{display:block;font-family:"IBM Plex Mono",monospace;font-weight:400;
  font-size:10.5px;color:var(--ink-soft);letter-spacing:.1em;margin-top:3px}
.rail-item{
  display:flex;gap:12px;align-items:center;width:100%;
  padding:11px 22px;border:none;background:none;color:var(--ink-soft);
  font-size:14px;text-align:left;transition:all .15s;
}
.rail-item:hover{color:var(--ink)}
.rail-item.active{color:var(--ink);background:var(--surface);font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent)}
.rail-dot{
  width:22px;height:22px;flex:none;border-radius:50%;
  border:1.5px solid var(--line);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;
}
.rail-item.done .rail-dot{background:var(--good);border-color:var(--good);color:#fff}
.rail-item.active .rail-dot{border-color:var(--accent);color:var(--accent)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;max-width:820px;padding:36px 40px 120px}
.step-head{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:20px;
  display:flex;align-items:baseline;gap:14px}
.step-head h1{font-family:"Noto Serif SC",serif;font-weight:700;font-size:24px;margin:0}
.step-head .hint{margin-left:auto;font-size:12.5px;color:var(--ink-soft)}
.lede{color:var(--ink-soft);margin:0 0 20px;max-width:38em}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin:14px 0}
.panel h3{margin:0 0 12px;font-size:15px;font-family:"Noto Serif SC",serif}

.btn{
  border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  padding:9px 20px;border-radius:8px;font-size:14px;font-weight:600;
}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:5px 12px;font-size:12.5px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status-cell{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.ok{background:var(--good)} .dot.bad{background:var(--accent)} .dot.warn{background:var(--warn-ink)}

.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 16px;background:var(--surface)}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500}
.stat span{font-size:12px;color:var(--ink-soft)}

.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .badge{position:absolute;left:6px;bottom:6px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;background:rgba(0,0,0,.65);color:#fff;padding:2px 7px;border-radius:5px}
.thumb.flagged{border-color:var(--accent);border-width:2px}
.thumb .flag{position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;
  font-size:10px;padding:2px 7px;border-radius:5px}
.thumb .nocap{position:absolute;top:6px;left:6px;background:var(--warn-ink);color:#fff;
  font-size:10px;padding:2px 7px;border-radius:5px}

.caption-editor{display:flex;gap:20px;align-items:flex-start}
.caption-editor .pic{flex:none;width:min(46%,340px)}
.caption-editor .pic img{width:100%;border-radius:8px;border:1px solid var(--line)}
.caption-editor .edit{flex:1;min-width:0}
.caption-editor textarea{min-height:120px;resize:vertical}
.cap-nav{display:flex;gap:8px;align-items:center;margin-top:10px}
.cap-pos{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:13px;
  background:var(--surface);color:var(--ink-soft)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
.vid-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.vid-card video{width:100%;display:block;background:#000;aspect-ratio:1}
.vid-meta{padding:10px 12px;font-size:12.5px}
.vid-meta .mono{background:none;padding:0}
.vid-status{padding:36px 0;text-align:center;color:var(--ink-soft);font-size:13px}
.stars{display:flex;gap:3px;margin:6px 0}
.stars button{border:none;background:none;font-size:19px;padding:0 2px;color:var(--line)}
.stars button.on{color:var(--accent)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface)}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:11.5px;
  color:var(--ink-soft);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.note{border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:11px 16px;border-radius:0 8px 8px 0;font-size:13.5px;margin:14px 0}
.note.good{border-color:var(--good);background:var(--good-soft)}
.note.warn{border-color:var(--warn-ink);background:var(--warn-soft)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:99px;
  font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.show{opacity:.95}

.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;
  text-align:center;color:var(--ink-soft);font-size:13.5px;cursor:pointer;transition:border-color .15s}
.dropzone:hover{border-color:var(--accent)}
.dropzone img{max-width:180px;border-radius:8px;margin-top:10px}

.rail-toggle{display:none}
@media (max-width:860px){
  .rail{position:fixed;z-index:40;left:0;top:0;bottom:0;transform:translateX(-100%);
    transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  .rail.open{transform:none}
  .rail-toggle{display:inline-block;position:fixed;left:14px;bottom:14px;z-index:41;
    width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);font-size:19px}
  .main{padding:24px 18px 120px}
  .caption-editor{flex-direction:column}
  .caption-editor .pic{width:100%}
}
</style>

<div class="layout">
  <nav class="rail" id="rail">
    <div class="rail-title">LoRA 工作台<small>IDENTITY LORA STUDIO</small></div>
    <div id="railItems"></div>
  </nav>
  <button class="rail-toggle" id="railToggle" type="button">☰</button>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= 基础设施 ================= */
const $ = s => document.querySelector(s);
const api = {
  async get(p){ const r = await fetch(p); return r.json(); },
  async post(p, body){ const r = await fetch(p, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); return r.json(); },
  async put(p, body){ const r = await fetch(p, {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); return r.json(); },
};
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

const STEPS = [
  {id:1, name:"环境自检"},
  {id:2, name:"照片集"},
  {id:3, name:"打标"},
  {id:4, name:"打包与训练"},
  {id:5, name:"安装 LoRA"},
  {id:6, name:"对照测试"},
  {id:7, name:"记录与诊断"},
];
const DONE_KEY = {1:"env",2:"scan",3:"captions",4:"zip",5:"install",6:"test",7:null};

let S = {          // 本地工作状态 (服务器 state.json 同步)
  step: 1, trigger: "", dataset_dir: "", zip_path: "", current_lora: "", expert: "low",
  done: {},
};
let scan = null;           // 最近一次扫描结果
let capIdx = 0;            // 打标页当前图片下标
let polling = null;

async function loadState(){
  try { const st = await api.get("/api/state"); S = Object.assign(S, st); } catch(e){}
}
async function saveState(patch){
  Object.assign(S, patch);
  try { S = Object.assign(S, await api.put("/api/state", patch)); } catch(e){}
  renderRail();
}

/* ================= 导航 ================= */
function renderRail(){
  $("#railItems").innerHTML = STEPS.map(s=>{
    const done = DONE_KEY[s.id] && S.done[DONE_KEY[s.id]];
    return `<button class="rail-item ${s.id===S.step?"active":""} ${done?"done":""}" data-step="${s.id}">
      <span class="rail-dot">${done?"✓":String(s.id).padStart(2,"0")}</span>${s.name}
    </button>`;
  }).join("");
  document.querySelectorAll(".rail-item").forEach(b=>b.onclick=()=>{
    saveState({step:+b.dataset.step}).then(render);
    $("#rail").classList.remove("open");
  });
}
function markDone(key){ const d=Object.assign({},S.done); d[key]=true; return saveState({done:d}); }

function render(){
  renderRail();
  const m = $("#main");
  clearInterval(polling);
  m.innerHTML = "";
  ({1:stepEnv,2:stepScan,3:stepCaption,4:stepTrain,5:stepInstall,6:stepTest,7:stepRuns}[S.step])(m);
  window.scrollTo(0,0);
}
function head(m, title, hint){
  m.insertAdjacentHTML("beforeend",
    `<div class="step-head"><h1>${title}</h1><span class="hint">${hint||""}</span></div>`);
}

/* ================= 01 环境自检 ================= */
async function stepEnv(m){
  head(m,"环境自检","自动");
  m.insertAdjacentHTML("beforeend",`<p class="lede">开始之前，确认这台 Mac Studio 的各个部件都在位。有任何一项红灯，先解决再继续。</p><div id="envBox"><span class="spin"></span> 检测中…</div>`);
  const st = await api.get("/api/status");
  const cell=(ok,label,extra)=>`<div class="status-cell"><span class="dot ${ok?"ok":"bad"}"></span><span>${label}${extra?` <span style="color:var(--ink-soft);font-size:12px">${extra}</span>`:""}</span></div>`;
  const md = st.models;
  const allOk = st.comfy && Object.values(md).every(Boolean) && st.loras_writable;
  $("#envBox").innerHTML = `
    <div class="panel"><h3>核心服务</h3><div class="status-grid">
      ${cell(st.comfy,"ComfyUI :8188", st.comfy?"运行中":"未启动 — 先跑 comfyui-web/start.sh")}
      ${cell(true,"LoRA 工作台 :8331","运行中")}
    </div></div>
    <div class="panel"><h3>Wan2.2 I2V 模型文件</h3><div class="status-grid">
      ${cell(md.low_noise_gguf,"LowNoise GGUF","Q4_K_M")}
      ${cell(md.high_noise_gguf,"HighNoise GGUF","Q4_K_M")}
      ${cell(md.lightx2v_low,"lightx2v 低噪 LoRA","4-step 加速")}
      ${cell(md.lightx2v_high,"lightx2v 高噪 LoRA","4-step 加速")}
      ${cell(md.clip,"umt5 CLIP","fp8")}
      ${cell(md.vae,"wan_2.1 VAE","")}
    </div></div>
    <div class="panel"><h3>资源</h3><div class="status-grid">
      ${cell(st.loras_writable,"loras 目录可写", LORAS_PATH)}
      ${cell(st.disk_free_gb>30,"磁盘剩余", st.disk_free_gb+" GB")}
    </div></div>
    ${allOk
      ? `<div class="note good">全部就绪。点「下一步」开始挑照片。</div>
         <button class="btn" id="envNext">下一步 →</button>`
      : `<div class="note warn">有红灯项。修复后点下方按钮重新检测。</div>
         <button class="btn ghost" onclick="render()">重新检测</button>`}`;
  if(allOk){
    markDone("env");
    $("#envNext").onclick = ()=>saveState({step:2}).then(render);
  }
}
const LORAS_PATH = "~/Projects/AI-Tools/ComfyUI/models/loras";

/* ================= 02 照片集 ================= */
async function stepScan(m){
  head(m,"照片集","目标 30–50 张");
  m.insertAdjacentHTML("beforeend",`
    <p class="lede">输入存放原图的目录，我来统计数量、分辨率，并标出不合格的照片。原则：<b>30 张精选胜过 60 张重复</b>；无美颜、无墨镜口罩、单人出镜、多角度多表情。</p>
    <div class="panel">
      <label class="field">照片目录</label>
      <div class="row">
        <input id="scanPath" style="flex:1" placeholder="/Users/jmok_studio/Pictures/wife_lora" value="${esc(S.dataset_dir)}">
        <button class="btn" id="scanBtn">扫描</button>
      </div>
    </div>
    <div id="scanResult"></div>`);
  $("#scanBtn").onclick = async ()=>{
    const path = $("#scanPath").value.trim();
    if(!path) return toast("先填目录路径");
    $("#scanResult").innerHTML = `<div class="panel"><span class="spin"></span> 扫描中…</div>`;
    scan = await api.post("/api/scan",{path});
    if(scan.error){ $("#scanResult").innerHTML = `<div class="note warn">${esc(scan.error)}</div>`; return; }
    await saveState({dataset_dir: scan.dir});
    renderScanResult();
  };
  if(S.dataset_dir){ $("#scanBtn").click(); }
}
function renderScanResult(){
  const box = $("#scanResult");
  const ok = scan.items.filter(i=>!i.small);
  const enough = scan.count>=30;
  const buckets = {};
  scan.items.forEach(i=>buckets[i.bucket]=(buckets[i.bucket]||0)+1);
  box.innerHTML = `
    <div class="stat-row">
      <div class="stat"><b>${scan.count}</b><span>照片总数</span></div>
      <div class="stat"><b style="color:${ok.length===scan.count?"var(--good)":"var(--accent)"}">${ok.length}</b><span>短边 ≥1024px</span></div>
      <div class="stat"><b>${scan.items.filter(i=>i.captioned).length}</b><span>已有 caption</span></div>
      <div class="stat"><b>${Object.entries(buckets).map(([k,v])=>k+"×"+v).join(" / ")||"—"}</b><span>画幅分布</span></div>
    </div>
    ${enough?"":`<div class="note warn">目前 ${scan.count} 张，不到 30 张下限。数量不足时 LoRA 容易学僵，建议补拍。</div>`}
    <div class="thumb-grid">${scan.items.map(i=>`
      <div class="thumb ${i.small?"flagged":""}">
        <img loading="lazy" src="/api/thumb?dir=${encodeURIComponent(scan.dir)}&name=${encodeURIComponent(i.name)}">
        <span class="badge">${i.w}×${i.h}</span>
        ${i.small?`<span class="flag">过小</span>`:""}
        ${i.captioned?"":`<span class="nocap">未标</span>`}
      </div>`).join("")}
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn" id="scanNext" ${enough?"":"disabled"}>确认照片集，进入打标 →</button>
      ${enough?"":`<span style="font-size:12.5px;color:var(--ink-soft)">满 30 张后可继续</span>`}
    </div>`;
  $("#scanNext") && ($("#scanNext").onclick = ()=>markDone("scan").then(()=>saveState({step:3})).then(render));
}

/* ================= 03 打标 ================= */
async function stepCaption(m){
  head(m,"打标","每张图一句英文描述");
  m.insertAdjacentHTML("beforeend",`
    <p class="lede">黄金法则：<b>描述一切会变的</b>（服装、场景、动作、光线），<b>不描述属于她的</b>（五官、脸型）——不被写出的特征才会绑定到触发词。每条 caption 以触发词开头。</p>
    <div class="panel">
      <label class="field">触发词（之后训练与生成都要用它，定下就不要改）</label>
      <input id="triggerInput" class="mono" placeholder="例如 taitai_jm" value="${esc(S.trigger)}" style="max-width:280px">
    </div>
    <div id="capBox"></div>`);
  $("#triggerInput").onchange = e=>{ saveState({trigger:e.target.value.trim()}); };
  if(!scan || scan.dir!==S.dataset_dir){
    scan = await api.post("/api/scan",{path:S.dataset_dir});
  }
  if(!scan || scan.error){ $("#capBox").innerHTML=`<div class="note warn">照片目录不可用，请回到上一步重新扫描。</div>`; return; }
  const captions = await api.get("/api/captions?dir="+encodeURIComponent(S.dataset_dir));
  scan.items.forEach(i=>i.caption = captions[i.name]||"");
  if(capIdx >= scan.items.length) capIdx = 0;
  renderCaptionEditor();
}
function renderCaptionEditor(){
  const it = scan.items[capIdx];
  const total = scan.items.length;
  const done = scan.items.filter(i=>i.caption && i.caption.trim()).length;
  $("#capBox").innerHTML = `
    <div class="panel caption-editor">
      <div class="pic"><img src="/api/photo?dir=${encodeURIComponent(scan.dir)}&name=${encodeURIComponent(it.name)}"></div>
      <div class="edit">
        <div class="mono" style="font-size:12px;color:var(--ink-soft);margin-bottom:6px">${esc(it.name)} · ${it.w}×${it.h}</div>
        <textarea id="capText" placeholder="${esc(S.trigger||"触发词")}, a woman wearing …">${esc(it.caption)}</textarea>
        <div class="cap-nav">
          <button class="btn ghost small" id="capPrev">← 上一张</button>
          <button class="btn small" id="capSave">保存</button>
          <button class="btn ghost small" id="capNext">下一张 →</button>
          <span class="spacer"></span>
          <span class="cap-pos">${capIdx+1} / ${total} · 已标 ${done}</span>
        </div>
      </div>
    </div>
    ${done===total
      ? `<div class="note good">全部 ${total} 张都已打标。</div><button class="btn" id="capNext2">下一步：打包 →</button>`
      : `<div class="note">还剩 ${total-done} 张未打标。建议每张都标；自动打标工具（JoyCaption / Florence-2）生成的初稿也要逐条过一遍。</div>`}
    <div class="thumb-grid">${scan.items.map((i,ix)=>`
      <div class="thumb" data-ix="${ix}" style="cursor:pointer;${i.caption&&i.caption.trim()?"":"opacity:.55"}">
        <img loading="lazy" src="/api/thumb?dir=${encodeURIComponent(scan.dir)}&name=${encodeURIComponent(i.name)}">
      </div>`).join("")}</div>`;
  async function save(){
    const cap = $("#capText").value.trim();
    if(cap && S.trigger && !cap.startsWith(S.trigger)){
      if(!confirm("这条 caption 没有以触发词开头，仍要保存吗？")) return false;
    }
    await api.post("/api/caption",{dir:scan.dir,name:it.name,caption:cap});
    it.caption = cap; return true;
  }
  $("#capSave").onclick = async ()=>{ if(await save()){ toast("已保存"); renderCaptionEditor(); } };
  $("#capPrev").onclick = async ()=>{ await save(); capIdx=(capIdx-1+total)%total; renderCaptionEditor(); };
  $("#capNext").onclick = async ()=>{ await save(); capIdx=(capIdx+1)%total; renderCaptionEditor(); };
  $("#capNext2") && ($("#capNext2").onclick = ()=>markDone("captions").then(()=>saveState({step:4})).then(render));
  document.querySelectorAll("#capBox .thumb").forEach(t=>t.onclick=async()=>{ await save(); capIdx=+t.dataset.ix; renderCaptionEditor(); });
}

/* ================= 04 打包与训练 ================= */
function stepTrain(m){
  head(m,"打包与云端训练","手动环节");
  m.insertAdjacentHTML("beforeend",`
    <p class="lede">本机 36GB 内存训不了 14B 模型，这一步在云端完成。我负责打包，你负责在训练平台点几下鼠标。</p>
    <div class="panel">
      <h3>① 打包数据集</h3>
      <div class="row">
        <button class="btn" id="zipBtn">打包为 zip</button>
        <span id="zipResult" style="font-size:13px;color:var(--ink-soft)">${S.zip_path?`上次打包：<span class="mono">${esc(S.zip_path)}</span>`:""}</span>
      </div>
    </div>
    <div class="panel">
      <h3>② 上传到训练平台（任选一个）</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>平台</th><th>做什么</th><th>参考成本</th></tr></thead>
        <tbody>
          <tr><td><b>fal.ai</b>（推荐首次）</td><td>搜 <code>wan-22 i2v lora trainer</code> → 传 zip → 填触发词 <code>${esc(S.trigger||"…")}</code> → steps 填 2500 → 运行</td><td>约 $3–8</td></tr>
          <tr><td><b>Replicate</b></td><td>同上，找社区 Wan 2.2 I2V 训练器</td><td>约 $3–10</td></tr>
          <tr><td><b>RunPod 自训</b></td><td>musubi-tuner：dim 32 / alpha 16 / lr 2e-4 / 2500 步 / 每 250 步存档</td><td>约 $2–5</td></tr>
        </tbody></table></div>
      <div class="note">训练目标基座务必选 <b>Wan 2.2 <u>I2V</u> A14B</b>（不要 T2V）。双专家 MoE：先只训 low-noise expert 即可见效，追求极致再补 high-noise。</div>
    </div>
    <div class="panel">
      <h3>③ 训练完成后</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:4px 0 12px">把每个 checkpoint 的 <code>.safetensors</code> 下载地址（或本机路径）拿到手，进入下一步安装。多个 checkpoint 都拿来，方便挑「最像但还没僵」的那个。</p>
      <div class="row">
        <button class="btn" id="trainDone">训练已提交 / 已完成 →</button>
        <button class="btn ghost small" id="trainSkip">跳过说明，直接去安装</button>
      </div>
    </div>`);
  $("#zipBtn").onclick = async ()=>{
    $("#zipBtn").disabled = true; $("#zipBtn").textContent = "打包中…";
    const r = await api.post("/api/zip",{path:S.dataset_dir});
    $("#zipBtn").disabled = false; $("#zipBtn").textContent = "打包为 zip";
    if(r.error) return toast(r.error);
    $("#zipResult").innerHTML = `<span class="mono">${esc(r.zip)}</span> · ${r.images} 图 + ${r.captions} 标注 · ${r.size_mb} MB`;
    toast("打包完成");
    markDone("zip");
  };
  const go = ()=>markDone("train").then(()=>saveState({step:5})).then(render);
  $("#trainDone").onclick = go;
  $("#trainSkip").onclick = ()=>saveState({step:5}).then(render);
}

/* ================= 05 安装 LoRA ================= */
async function stepInstall(m){
  head(m,"安装 LoRA","放入 ComfyUI");
  m.insertAdjacentHTML("beforeend",`
    <p class="lede">把训练产出的 <code>.safetensors</code> 装进 <code>${LORAS_PATH}</code>。支持直接粘贴下载 URL（走本机代理下载）或本机文件路径。</p>
    <div class="panel">
      <label class="field">来源（https:// 下载地址 或 /本机/文件路径）</label>
      <input id="loraSrc" placeholder="https://…/taitai_jm_2500.safetensors 或 ~/Downloads/taitai_jm_2500.safetensors">
      <label class="field">保存为文件名</label>
      <input id="loraName" class="mono" placeholder="taitai_jm_2500.safetensors" style="max-width:340px">
      <div class="row" style="margin-top:14px">
        <button class="btn" id="installBtn">安装</button>
        <span id="installMsg" style="font-size:13px;color:var(--ink-soft)"></span>
      </div>
    </div>
    <div class="panel"><h3>loras 目录现有文件</h3><div id="loraList"><span class="spin"></span></div></div>
    <div id="installNext"></div>`);
  async function refresh(){
    const list = await api.get("/api/loras");
    $("#loraList").innerHTML = `<div class="tablewrap"><table>
      <thead><tr><th>当前</th><th>文件</th><th>大小</th><th>修改时间</th></tr></thead>
      <tbody>${list.map(l=>`<tr>
        <td><input type="radio" name="curlora" value="${esc(l.name)}" ${l.name===S.current_lora?"checked":""} style="width:auto"></td>
        <td class="mono" style="background:none;padding:9px 12px">${esc(l.name)}</td>
        <td>${l.size_mb} MB</td>
        <td>${new Date(l.mtime*1000).toLocaleString("zh-CN")}</td></tr>`).join("")}</tbody></table></div>`;
    document.querySelectorAll("input[name=curlora]").forEach(r=>r.onchange=async()=>{
      await saveState({current_lora:r.value}); toast("当前 LoRA：" + r.value); renderInstallNext();
    });
    renderInstallNext();
  }
  function renderInstallNext(){
    $("#installNext").innerHTML = S.current_lora
      ? `<div class="note good">当前 LoRA：<code>${esc(S.current_lora)}</code></div>
         <button class="btn" id="instNext">下一步：对照测试 →</button>` : "";
    const b = $("#instNext");
    b && (b.onclick = ()=>markDone("install").then(()=>saveState({step:6})).then(render));
  }
  $("#installBtn").onclick = async ()=>{
    const source = $("#loraSrc").value.trim(), name = $("#loraName").value.trim();
    if(!source || !name) return toast("来源和文件名都要填");
    $("#installBtn").disabled = true; $("#installMsg").textContent = "安装中（大文件下载需要几分钟）…";
    const r = await api.post("/api/lora/install",{source,name});
    $("#installBtn").disabled = false;
    if(r.error){ $("#installMsg").textContent = "失败：" + r.error; return; }
    $("#installMsg").textContent = `已安装 ${r.name}（${r.size_mb} MB）`;
    toast("安装完成"); refresh();
  };
  refresh();
}

/* ================= 06 对照测试 ================= */
async function stepTest(m){
  head(m,"对照测试","同 seed 多强度");
  m.insertAdjacentHTML("beforeend",`
    <p class="lede">同一首帧、同一 seed，跑不同强度的矩阵，视频会并排出现在下方。给每条打分，几轮之后甜区自然浮现。</p>
    <div class="panel">
      <div class="row">
        <div style="flex:1;min-width:220px">
          <label class="field">LoRA checkpoint</label>
          <select id="testLora"></select>
        </div>
        <div style="width:150px">
          <label class="field">挂载位置</label>
          <select id="testExpert">
            <option value="low">仅低噪专家</option>
            <option value="both">双专家</option>
          </select>
        </div>
        <div style="width:120px">
          <label class="field">Seed</label>
          <input id="testSeed" class="mono" value="42">
        </div>
      </div>
      <label class="field">强度（点选多个）</label>
      <div class="chips" id="strengthChips"></div>
      <label class="field">首帧参考图（拖到框里或点击选择）</label>
      <div class="dropzone" id="dropzone">选择图片…<div id="dzPrev"></div></div>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <label class="field">提示词</label>
      <textarea id="testPrompt" rows="2">${esc(S.trigger?S.trigger+", ":"")}a woman walking through a sunlit garden, turning to smile at the camera, natural movement</textarea>
      <div class="row" style="margin-top:6px">
        <div style="width:100px"><label class="field">宽</label><input id="tw" class="mono" value="640"></div>
        <div style="width:100px"><label class="field">高</label><input id="th" class="mono" value="640"></div>
        <div style="width:100px"><label class="field">帧数</label><input id="tf" class="mono" value="49"></div>
        <div style="width:100px"><label class="field">FPS</label><input id="tfps" class="mono" value="16"></div>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn accent" id="runBtn">提交矩阵</button>
        <span id="runMsg" style="font-size:13px;color:var(--ink-soft)"></span>
      </div>
    </div>
    <div id="videoBox"></div>`);
  const loras = (await api.get("/api/loras")).filter(l=>!l.name.includes("lightx2v"));
  $("#testLora").innerHTML = loras.map(l=>`<option ${l.name===S.current_lora?"selected":""}>${esc(l.name)}</option>`).join("");
  $("#testExpert").value = S.expert || "low";
  $("#testExpert").onchange = e=>saveState({expert:e.target.value});
  const strengths = new Set([0.6,0.8,1.0]);
  const chosen = new Set([0.6,0.8,1.0]);
  function drawChips(){
    $("#strengthChips").innerHTML = [...strengths].sort().map(s=>
      `<button class="chip ${chosen.has(s)?"on":""}" data-s="${s}">${s.toFixed(1)}</button>`).join("") +
      `<button class="chip" id="chipAdd" title="添加自定义强度">＋</button>`;
    document.querySelectorAll("#strengthChips .chip[data-s]").forEach(c=>c.onclick=()=>{
      const v=+c.dataset.s; chosen.has(v)?chosen.delete(v):chosen.add(v); drawChips();
    });
    $("#chipAdd").onclick=()=>{ const v=parseFloat(prompt("强度值 (0.1–1.5)：","0.7")); if(v>0&&v<=1.5){strengths.add(v);chosen.add(v);drawChips();} };
  }
  drawChips();
  let comfyImageName = null;
  const dz = $("#dropzone"), fi = $("#fileInput");
  dz.onclick = ()=>fi.click();
  dz.ondragover = e=>{e.preventDefault(); dz.style.borderColor="var(--accent)";};
  dz.ondragleave = ()=>dz.style.borderColor="";
  dz.ondrop = e=>{e.preventDefault(); dz.style.borderColor=""; if(e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);};
  fi.onchange = ()=>fi.files[0] && upload(fi.files[0]);
  async function upload(file){
    $("#dzPrev").innerHTML = `<span class="spin"></span> 上传到 ComfyUI…`;
    const r = await fetch("/api/upload?name="+encodeURIComponent(file.name),{method:"PUT",body:file});
    const j = await r.json();
    comfyImageName = j.name;
    const url = URL.createObjectURL(file);
    $("#dzPrev").innerHTML = `<img src="${url}"><div style="font-size:12px;margin-top:6px" class="mono">${esc(j.name)}</div>`;
    toast("首帧已上传");
  }
  let currentIds = [];
  $("#runBtn").onclick = async ()=>{
    if(!comfyImageName) return toast("先上传首帧参考图");
    if(!chosen.size) return toast("至少选一个强度");
    const payload = {
      lora: $("#testLora").value, expert: $("#testExpert").value,
      strengths: [...chosen].sort(), seed: +$("#testSeed").value||42,
      image_name: comfyImageName, prompt: $("#testPrompt").value.trim(),
      width:+$("#tw").value||640, height:+$("#th").value||640,
      frames:+$("#tf").value||49, fps:+$("#tfps").value||16,
    };
    $("#runBtn").disabled = true; $("#runMsg").textContent = "提交中…";
    const r = await api.post("/api/test", payload);
    $("#runBtn").disabled = false;
    if(r.error){ $("#runMsg").textContent = "失败：" + r.error; return; }
    currentIds = r.submitted.map(x=>x.id);
    $("#runMsg").textContent = `已提交 ${currentIds.length} 条，每条约 3–6 分钟`;
    markDone("test");
    drawVideos(r.submitted.map(x=>({id:x.id,strength:x.strength})));
    pollStatus();
  };
  function drawVideos(entries){
    $("#videoBox").innerHTML = `<div class="video-grid">${entries.map(e=>`
      <div class="vid-card" data-id="${e.id}">
        <div class="vid-status" data-role="status"><span class="spin"></span> 排队 / 生成中…</div>
        <div class="vid-meta">
          <div>强度 <b class="mono">${e.strength.toFixed(1)}</b> · seed <span class="mono">${$("#testSeed").value}</span></div>
          <div class="stars" data-role="stars">${[1,2,3,4,5].map(n=>`<button data-n="${n}">★</button>`).join("")}</div>
          <input placeholder="备注（像不像 / 僵不僵）" data-role="note" style="font-size:12.5px;padding:5px 9px">
        </div>
      </div>`).join("")}</div>`;
    document.querySelectorAll(".vid-card").forEach(card=>{
      const id = card.dataset.id;
      let score = 0;
      function saveRating(){
        api.post("/api/rate",{id, score, note: card.querySelector("[data-role=note]").value});
      }
      card.querySelectorAll("[data-role=stars] button").forEach(b=>b.onclick=()=>{
        score = +b.dataset.n;
        b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on", +x.dataset.n<=score));
        saveRating();
      });
      card.querySelector("[data-role=note]").onchange = saveRating;
    });
  }
  async function pollStatus(){
    clearInterval(polling);
    polling = setInterval(async ()=>{
      if(!currentIds.length) return clearInterval(polling);
      const st = await api.get("/api/test/status?ids="+currentIds.join(","));
      let allDone = true;
      currentIds.forEach(id=>{
        const info = st[id];
        const card = document.querySelector(`.vid-card[data-id="${id}"]`);
        if(!card || !info) return;
        if(info.status==="done" && info.video){
          const v = info.video;
          const src = `/api/view?filename=${encodeURIComponent(v.filename)}&subfolder=${encodeURIComponent(v.subfolder||"")}&type=${v.type||"output"}`;
          const slot = card.querySelector("[data-role=status]");
          if(slot) slot.outerHTML = `<video src="${src}" controls loop muted playsinline></video>`;
        } else allDone = false;
      });
      if(allDone){ clearInterval(polling); $("#runMsg").textContent = "全部完成，打分后可在「记录与诊断」回看"; }
    }, 5000);
  }
  // 恢复未完成的历史
  const runs = await api.get("/api/runs");
  const pending = runs.filter(r=>!r.video).slice(0,6);
  if(pending.length && !currentIds.length){
    currentIds = pending.map(r=>r.id);
    drawVideos(pending.map(r=>({id:r.id,strength:r.strength})));
    pollStatus();
  }
}

/* ================= 07 记录与诊断 ================= */
async function stepRuns(m){
  head(m,"记录与诊断","数据不说谎");
  m.insertAdjacentHTML("beforeend",`<div id="runsBox"><span class="spin"></span></div>`);
  const runs = await api.get("/api/runs");
  const rows = runs.map(r=>`
    <tr>
      <td class="mono" style="background:none;padding:9px 12px;font-size:11.5px">${esc(r.ts)}</td>
      <td class="mono" style="background:none;padding:9px 12px;font-size:11.5px">${esc(r.lora.replace(".safetensors",""))}</td>
      <td>${r.strength.toFixed(1)}</td>
      <td>${r.expert==="both"?"双":"低"}</td>
      <td>${r.seed}</td>
      <td>${r.video?`<a href="/api/view?filename=${encodeURIComponent(r.video.filename)}&subfolder=${encodeURIComponent(r.video.subfolder||"")}&type=${r.video.type||"output"}" target="_blank" style="color:var(--accent)">播放</a>`:"—"}</td>
      <td>${r.score?"★".repeat(r.score):"—"}</td>
      <td style="font-size:12px">${esc(r.note||"")}</td>
    </tr>`).join("");
  const best = runs.filter(r=>r.score>=4).sort((a,b)=>b.score-a.score)[0];
  $("#runsBox").innerHTML = `
    ${best?`<div class="note good">当前最佳：<code>${esc(best.lora)}</code> @ 强度 ${best.strength}（${best.score} 分${best.note?" · "+esc(best.note):""}）。</div>`:""}
    <div class="panel"><h3>实验记录（${runs.length} 条）</h3>
      ${runs.length?`<div class="tablewrap"><table>
        <thead><tr><th>时间</th><th>LoRA</th><th>强度</th><th>专家</th><th>seed</th><th>视频</th><th>评分</th><th>备注</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`:`<p style="color:var(--ink-soft);font-size:13.5px">还没有实验记录，先去「对照测试」跑一组。</p>`}
    </div>
    <div class="panel"><h3>症状 → 处方</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>症状</th><th>诊断</th><th>处方</th></tr></thead><tbody>
        <tr><td>不像她，随机路人脸</td><td>欠拟合</td><td>加 steps 重训；强度提到 0.9–1.0；检查 caption 是否以触发词开头</td></tr>
        <tr><td>像，但僵硬、构图死板</td><td>过拟合</td><td>换更早的 checkpoint；强度降到 0.6–0.7；lr 减半重训</td></tr>
        <tr><td>首帧像，动起来脸漂移</td><td>视频身份弱</td><td>强度上调；试试「双专家」挂载；缩短时长（49 帧内更稳）</td></tr>
        <tr><td>自带滤镜感 / 固定背景</td><td>数据集污染</td><td>补多样照片重训，参数不用动</td></tr>
        <tr><td>转头、侧脸崩坏</td><td>角度覆盖不足</td><td>补 3/4 侧、正侧脸照片重训</td></tr>
        </tbody></table></div>
    </div>`;
}
